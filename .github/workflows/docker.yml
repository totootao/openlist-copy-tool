name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # 通过 ghproxy 加速 Go 模块代理（符合国内网络环境）
      - name: Configure GOPROXY
        run: echo "GOPROXY=https://ghproxy.totootao.top/https://proxy.golang.org,direct" >> "$GITHUB_ENV"

      - name: Build (verify)
        run: go build -v ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openlist-copy-tool:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openlist-copy-tool:${{ github.sha }}
